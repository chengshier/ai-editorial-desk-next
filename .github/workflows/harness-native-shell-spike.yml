name: Harness Native Shell Spike

on:
  pull_request:
    paths:
      - "integrations/harness/native-shell-spike-package/**"
      - "integrations/harness/scripts/prepare_native_shell_spike.py"
      - "apps/editorial_api/main.py"
      - "tests/browser/harness-native-shell-spike.cjs"
      - ".github/workflows/harness-native-shell-spike.yml"

jobs:
  native-shell-and-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout AI Editorial Desk Next
        uses: actions/checkout@v4

      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: .harness-upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check apps packages tests integrations/harness/scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install pristine Harness workspace
        working-directory: .harness-upstream
        run: pnpm install --frozen-lockfile

      - name: Build pristine pinned Harness
        working-directory: .harness-upstream
        run: pnpm run build

      - name: Prove headless agent execution without Web UI
        working-directory: .harness-upstream
        run: >-
          pnpm exec vitest run packages/sdk/server/tests/server.spec.ts
          -t "creates a harness agent and calls the configured OpenAI-compatible endpoint"

      - name: Prepare native shell plugin
        run: python integrations/harness/scripts/prepare_native_shell_spike.py .harness-upstream

      - name: Reconcile Harness workspace
        working-directory: .harness-upstream
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck native shell plugin
        working-directory: .harness-upstream
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc -b packages/client/editorial-native-shell-spike/tsconfig.json 2>&1 \
            | tee /tmp/native-shell-typecheck.log

      - name: Bundle native shell plugin
        working-directory: .harness-upstream
        run: pnpm --filter @ai-editorial-desk/harness-native-shell-spike run bundle

      - name: Install plugin into isolated Harness web profile
        working-directory: .harness-upstream
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.dsh-native-shell-spike-home"
          pnpm dsh plugin --profile web add ./packages/client/editorial-native-shell-spike

      - name: Install browser probe
        shell: bash
        run: |
          mkdir -p /tmp/editorial-browser-probe
          cd /tmp/editorial-browser-probe
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Boot Editorial API and Harness Web
        shell: bash
        run: |
          set -Eeuo pipefail
          API_PID=""
          HARNESS_PID=""
          cleanup() {
            if [[ -n "${HARNESS_PID:-}" ]]; then kill "$HARNESS_PID" 2>/dev/null || true; fi
            if [[ -n "${API_PID:-}" ]]; then kill "$API_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          python -m uvicorn apps.editorial_api.main:app --host 127.0.0.1 --port 18000 >/tmp/native-shell-api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/api/v1/spike/opportunities >/tmp/native-shell-opportunities.json

          (
            cd .harness-upstream
            export DSH_HOME="$PWD/.dsh-native-shell-spike-home"
            pnpm dsh web >/tmp/native-shell-harness.log 2>&1
          ) &
          HARNESS_PID=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3080/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3080/ >/dev/null

          PLAYWRIGHT_MODULE=/tmp/editorial-browser-probe/node_modules/playwright \
            node tests/browser/harness-native-shell-spike.cjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-native-shell-spike-${{ github.run_id }}
          path: |
            /tmp/native-shell-typecheck.log
            /tmp/native-shell-api.log
            /tmp/native-shell-harness.log
            /tmp/native-shell-opportunities.json
            /tmp/native-shell-browser.log
            /tmp/native-shell-browser.png
            /tmp/native-shell-browser-body.txt
          if-no-files-found: ignore
          retention-days: 7
